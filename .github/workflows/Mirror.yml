name: Mirror SUSFS4KSU
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: susfs-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror GitLab Repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          SOURCE="https://gitlab.com/simonpunk/susfs4ksu.git"
          TARGET="https://x-access-token:${GH_TOKEN}@github.com/AndreiMikh/susfs4ksu.git"
          git clone --mirror "$SOURCE" susfs4ksu.git
          cd susfs4ksu.git
          git push "$TARGET" \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'
          echo "└─ SUSFS4KSU branches and tags synchronized"
