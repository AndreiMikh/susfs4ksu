name: Mirror SUSFS4KSU
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror GitLab Repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          git clone --mirror https://gitlab.com/simonpunk/susfs4ksu.git
          cd susfs4ksu.git
          git push --mirror "https://x-access-token:${GH_TOKEN}@github.com/AndreiMikh/susfs4ksu.git"
