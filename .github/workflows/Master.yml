name: Mirror SUSFS
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
permissions:
  contents: write
concurrency:
  group: susfs-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror Selected Branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          SOURCE="https://gitlab.com/simonpunk/susfs4ksu.git"
          TARGET="https://x-access-token:${GH_TOKEN}@github.com/AndreiMikh/susfs4ksu.git"
          git init susfs4ksu
          cd susfs4ksu
          git remote add source "$SOURCE"
          git fetch source \
            '+refs/heads/gki-android15-6.6:refs/remotes/source/gki-android15-6.6' \
            '+refs/heads/gki-android15-6.6-dev:refs/remotes/source/gki-android15-6.6-dev' \
            '+refs/heads/gki-android16-6.12:refs/remotes/source/gki-android16-6.12' \
            '+refs/heads/gki-android16-6.12-dev:refs/remotes/source/gki-android16-6.12-dev' \
            '+refs/heads/gki-android14-6.1:refs/remotes/source/gki-android14-6.1' \
            '+refs/heads/gki-android14-6.1-dev:refs/remotes/source/gki-android14-6.1-dev' \
            '+refs/heads/gki-android13-5.15:refs/remotes/source/gki-android13-5.15' \
            '+refs/heads/gki-android13-5.15-dev:refs/remotes/source/gki-android13-5.15-dev' \
            '+refs/heads/gki-android13-5.10:refs/remotes/source/gki-android13-5.10' \
            '+refs/heads/gki-android13-5.10-dev:refs/remotes/source/gki-android13-5.10-dev' \
            '+refs/tags/*:refs/tags/*'
          git remote add target "$TARGET"
          git push target \
            'refs/remotes/source/gki-android15-6.6:refs/heads/gki-android15-6.6' \
            'refs/remotes/source/gki-android15-6.6-dev:refs/heads/gki-android15-6.6-dev' \
            'refs/remotes/source/gki-android16-6.12:refs/heads/gki-android16-6.12' \
            'refs/remotes/source/gki-android16-6.12-dev:refs/heads/gki-android16-6.12-dev' \
            'refs/remotes/source/gki-android14-6.1:refs/heads/gki-android14-6.1' \
            'refs/remotes/source/gki-android14-6.1-dev:refs/heads/gki-android14-6.1-dev' \
            'refs/remotes/source/gki-android13-5.15:refs/heads/gki-android13-5.15' \
            'refs/remotes/source/gki-android13-5.15-dev:refs/heads/gki-android13-5.15-dev' \
            'refs/remotes/source/gki-android13-5.10:refs/heads/gki-android13-5.10' \
            'refs/remotes/source/gki-android13-5.10-dev:refs/heads/gki-android13-5.10-dev' \
            --tags
          echo "└─ SUSFS4KSU selected branches and tags synchronized"
